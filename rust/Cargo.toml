[package]
name = "local_proxy_rust"
version = "0.1.0"
edition = "2021"

authors = ["LocalProxy Team"]
description = "LocalProxy Rust networking core"

[[bin]]
name = "local_proxy_core"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
bytes = "1"
dirs = "6"
futures-util = "0.3"
http-body-util = "0.1"
http-body = "1"
http = "1"
hyper = { version = "1.11", features = ["client", "http1", "server"] }
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
keyring = "4.2"
russh = { version = "0.63", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-service = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
